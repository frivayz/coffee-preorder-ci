name: Coffee Preorder CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Матрица версий: убеждаемся, что проект работает не на одной версии Python
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Type Checker (mypy)
        run: mypy coffee_shop.py

      - name: Run Unit Tests (pytest)
        run: pytest test_coffee_shop.py -v --cov=coffee_shop --cov-report=term-missing
